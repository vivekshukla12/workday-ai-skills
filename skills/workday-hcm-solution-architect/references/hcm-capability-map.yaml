cross_cutting_capabilities:

  SECURITY:
    role: cross_cutting
    purpose: >-
      Evaluate domain security, business process security, role/context constraints,
      segment-based security, self-service access, and sensitive data exposure.
    activate_when:
      - access_or_visibility_question
      - manager_or_worker_self_service
      - country_or_segmented_data
      - business_process_routing
      - sensitive_worker_data
      - safety_or_talent_confidentiality

  BUSINESS_PROCESS:
    role: cross_cutting
    purpose: >-
      Evaluate initiation, approvals, action steps, subprocesses, condition rules,
      dynamic routing, notifications, and event lifecycle.
    activate_when:
      - approval_routing
      - hire_or_change_job
      - recruiting_stage_flow
      - absence_request
      - time_approval
      - compensation_event
      - safety_incident_workflow

  REPORTING_ANALYTICS:
    role: cross_cutting
    purpose: >-
      Evaluate delivered reports, report data sources, auditability, operational monitoring,
      configuration validation, and downstream analytics requirements.
    activate_when:
      - audit_or_monitoring_requirement
      - operational_dashboard
      - compliance_reporting
      - configuration_validation
      - workforce_metrics

  INTEGRATIONS:
    role: cross_cutting
    purpose: >-
      Evaluate inbound/outbound data flows, EIB/web services/connectors, external systems,
      high-volume data movement, and integration side effects of configuration.
    activate_when:
      - external_system
      - mass_data_load
      - payroll_interface
      - time_clock_integration
      - benefits_provider
      - recruiting_provider
      - learning_provider
      - configuration_changes_affect_interfaces

  PAYROLL:
    role: cross_cutting_external_domain
    purpose: >-
      Evaluate downstream pay processing implications when HCM, compensation, time,
      absence, benefits, worker/job, or organization configuration affects payroll.
    activate_when:
      - hourly_or_time_based_pay
      - overtime
      - allowance_or_earning
      - pay_group
      - period_schedule
      - leave_with_payroll_effect
      - benefit_deduction
      - staffing_or_position_change
    source_strategy:
      primary: "Payroll Admin Guide"
      secondary: "HCM Admin Guide touchpoints"

routing_policy:
  step_1: identify_business_problem_and_population
  step_2: map_to_1_to_4_primary_capabilities
  step_3: add_only_material_cross_cutting_capabilities
  step_4: inspect_documented_touchpoints_for_second_hop_dependencies
  step_5: choose_specific_retrieval_topics
  step_6: retrieve_minimum_sufficient_evidence
  step_7: synthesize_solution_and_mark_assumptions

  guardrails:
    - "Do not treat routing_cues as documented Workday terminology."
    - "Do not activate a module merely because it could theoretically interact with the problem."
    - "Do not retrieve whole product sections when a named topic is sufficient."
    - "Separate documented behavior from solution recommendation."
    - "Mark unconfirmed business characteristics as assumptions or questions."
    - "Escalate to Payroll, Integrations, or Reporting source guides when they are the authoritative source."

