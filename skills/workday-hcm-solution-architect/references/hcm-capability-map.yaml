# Workday HCM Solution Architect - Capability Map
# Phase 2 working artifact (NOT the skill itself)
# Version: 0.1
# Basis: Workday Human Capital Management Product Summary, Aug 6 2026
#
# Design convention:
# - documented_scope / key_topics / documented_touchpoints: derived from the supplied Workday HCM guide.
# - routing_cues: skill-design inference used to recognize business questions; these are NOT official Workday classifications.
# - retrieval_topics: narrow documentation targets for later retrieval; they are not intended to preload guide content.

metadata:
  artifact: hcm_capability_map
  version: "0.1"
  phase: 2
  status: working_draft
  objective: >-
    Route business and consulting questions to the smallest relevant set of Workday HCM
    capabilities before retrieving detailed documentation.
  token_strategy:
    - classify_business_problem_before_document_retrieval
    - activate_only_relevant_capabilities
    - expand_cross_module_touchpoints_only_when_material
    - retrieve_specific_topics_not_entire_sections
    - stop_retrieval_when_sufficient_evidence_exists

